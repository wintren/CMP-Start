name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the run it superseded.
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that does not need a Mac. This is the job that fails when a rule is broken, so it
  # runs first and alone — a red :archtest is an answer you want in a minute, not after an Xcode
  # runner has finished booting.
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          # Only the default branch writes the cache; PRs read it. Otherwise every PR fights over
          # the same entry and none of them get a warm one.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Architecture rules
        run: ./gradlew :archtest:test

      - name: Unit tests
        run: ./gradlew :domain:desktopTest :data:desktopTest :app:desktopTest :core:common:desktopTest :design:desktopTest

      # The same commonTest sources on the other compiler backend. Kotlin/wasm disagrees with the
      # JVM about enough — number formatting, date parsing, reflection — that compiling for it is
      # not the same as running on it. Needs a Chrome on the runner, which ubuntu-latest has.
      - name: Web tests
        run: ./gradlew :domain:wasmJsBrowserTest :data:wasmJsBrowserTest :app:wasmJsBrowserTest :core:common:wasmJsBrowserTest :design:wasmJsBrowserTest

      - name: Android
        run: ./gradlew :launch:android:assembleDebug

      - name: Desktop
        run: ./gradlew :launch:desktop:compileKotlinDesktop

      - name: Web
        run: ./gradlew :launch:web:wasmJsBrowserDistribution

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore

  # Kotlin/Native is the only thing here that needs macOS, and macOS minutes are billed at ten
  # times the Linux rate. Keep it to exactly that: the framework link and the native tests.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: iOS framework
        run: ./gradlew :launch:ios:linkDebugFrameworkIosSimulatorArm64

      # Kotlin/Native is the backend most likely to disagree with the JVM, and the one whose
      # failures are hardest to debug in the field: this is where `NSLog("%@", …)` segfaulting was
      # caught. Test names may not contain a comma here — the compiler rejects them.
      - name: iOS tests
        run: ./gradlew :domain:iosSimulatorArm64Test :data:iosSimulatorArm64Test :app:iosSimulatorArm64Test :core:common:iosSimulatorArm64Test :design:iosSimulatorArm64Test

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ios
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: ignore
