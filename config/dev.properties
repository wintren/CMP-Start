# Checked in. Never put a secret here — see "Configuration" in README.md.
#
# Every key becomes a property on the generated `AppConfig`, so this file is also the schema:
# a key that is not here does not exist. `true`/`false` generate a Boolean, digits an Int,
# anything else a String.
#
# A value of `required` generates nothing and fails the build until the machine or the CI job
# supplies it — see prod.properties.

apiBaseUrl=https://api.open-meteo.com/v1
geocodingBaseUrl=https://geocoding-api.open-meteo.com/v1

# Open-Meteo needs no key on its free tier. Here as the worked example of a secret: it stays
# empty in git, and `local.properties` or `APP_API_TOKEN` fills it in.
apiToken=

logRequests=true
