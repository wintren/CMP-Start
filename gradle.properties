kotlin.code.style=official

# -- Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Off: unsupported for KMP wasmJs targets (KT-52074) — KGP warns it "may lead to unpredictable
# and inconsistent behaviour" on every build.
org.gradle.configureondemand=false
# Off for the same reason; turn on once you drop the wasmJs target.
org.gradle.parallel=false

# -- Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# -- Compose
org.jetbrains.compose.experimental.wasm.enabled=true

# -- Kotlin Multiplatform
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
